[project]
name = "newsspider"
version = "1.0.0"
description = "News scraper and ranker for day trading"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0", "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
newsspider = "newsspider.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newsspider"]

[tool.setuptools.package-data]
newsspider = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
