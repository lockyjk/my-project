# Trading news spider configuration.

# SEC and Reddit block generic agents: put a real contact email here.
user_agent = "trading-news-spider/1.0 (personal research; contact: you@example.com)"
database = "news.db"
poll_seconds = 60          # how often `watch` re-crawls every source
min_host_interval = 2.0    # seconds between hits to the same host
max_age_hours = 24         # ignore items older than this
half_life_minutes = 60     # score halves every hour: fresh news ranks first

# Tickers you trade. Per-ticker feeds below run once for each of these.
watchlist = ["AAPL", "NVDA", "TSLA", "AMD", "MSFT", "META", "AMZN", "SPY", "QQQ"]

# Company names that should map to a ticker when no symbol is printed.
[aliases]
"Apple" = "AAPL"
"Nvidia" = "NVDA"
"Tesla" = "TSLA"
"Advanced Micro Devices" = "AMD"
"Microsoft" = "MSFT"
"Meta Platforms" = "META"
"Amazon" = "AMZN"

# Only keep news the trading plan can act on: a named stock plus a buy catalyst (earnings, guidance,
# FDA, contract, upgrade, buyback) or a veto catalyst (offering, bankruptcy, legal, short report,
# halt, merger). Market chatter, opinion and macro stories are dropped before they are stored.
[filter]
enabled = true
require_ticker = true
keep_macro = false        # true to also keep Fed/CPI/jobs stories for context
extra_catalysts = []      # e.g. ["insider", "split", "leadership"]

[alerts]
min_score = 6.0            # print/send an alert when a new story scores this high
webhook_url = ""           # optional Discord or Slack incoming-webhook URL

# kind = "rss" (RSS/Atom), "sec" (EDGAR Atom; tickers resolved from CIK) or "reddit" (JSON listing)
# per_ticker = true runs the URL once per watchlist ticker, filling in {ticker}.

[[sources]]
name = "Yahoo Finance"
kind = "rss"
url = "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"
per_ticker = true

[[sources]]
name = "Google News"
kind = "rss"
url = "https://news.google.com/rss/search?q=%24{ticker}+OR+%22{ticker}+stock%22+when:1d&hl=en-US&gl=US&ceid=US:en"
per_ticker = true

[[sources]]
name = "Nasdaq"
kind = "rss"
url = "https://www.nasdaq.com/feed/rssoutbound?symbol={ticker}"
per_ticker = true

[[sources]]
name = "CNBC Top News"
kind = "rss"
url = "https://www.cnbc.com/id/100003114/device/rss/rss.html"

[[sources]]
name = "CNBC Markets"
kind = "rss"
url = "https://www.cnbc.com/id/20910258/device/rss/rss.html"

[[sources]]
name = "CNBC Earnings"
kind = "rss"
url = "https://www.cnbc.com/id/15839135/device/rss/rss.html"

[[sources]]
name = "MarketWatch Top Stories"
kind = "rss"
url = "https://feeds.content.dowjones.io/public/rss/mw_topstories"

[[sources]]
name = "MarketWatch Market Pulse"
kind = "rss"
url = "https://feeds.content.dowjones.io/public/rss/mw_marketpulse"

[[sources]]
name = "Seeking Alpha Market Currents"
kind = "rss"
url = "https://seekingalpha.com/market_currents.xml"

[[sources]]
name = "Nasdaq Markets"
kind = "rss"
url = "https://www.nasdaq.com/feed/rssoutbound?category=Markets"

[[sources]]
name = "PR Newswire"
kind = "rss"
url = "https://www.prnewswire.com/rss/news-releases-list.rss"

[[sources]]
name = "GlobeNewswire"
kind = "rss"
url = "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"

[[sources]]
name = "Federal Reserve"
kind = "rss"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
enabled = false            # macro only; turn on together with filter.keep_macro

[[sources]]
name = "SEC 8-K filings"
kind = "sec"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=100&output=atom"

[[sources]]
name = "SEC offerings (424B)"
kind = "sec"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=424B&count=100&output=atom"

[[sources]]
name = "r/wallstreetbets"
kind = "reddit"
url = "https://www.reddit.com/r/wallstreetbets/new.json?limit=50"
enabled = false            # noisy; turn on if you want retail chatter

[[sources]]
name = "r/stocks"
kind = "reddit"
url = "https://www.reddit.com/r/stocks/new.json?limit=50"
enabled = false

# ---------------------------------------------------------------------------
# Trading bot: the Catalyst Momentum plan (see newsspider/strategy.py).
# Every number below is a rule of the plan. Change them only after backtesting.
[bot]
min_sentiment = 0.2
min_price = 5.0
min_dollar_volume = 20000000   # average daily $ volume, so fills are realistic
min_gap_pct = 2.0              # must open at least 2% above yesterday's close
min_rel_volume = 2.0           # at least 2x normal volume for the time of day
opening_range_minutes = 15
max_chase_pct = 1.0            # skip if already >1% above the opening-range high
entry_start = "09:45"
entry_end = "11:30"
exit_time = "15:55"            # never hold overnight
min_stop_pct = 0.5
max_stop_pct = 3.0
target_r = 2.0                 # take profit at 2x the risk
breakeven_r = 1.0              # move stop to entry once +1R
slippage_pct = 0.05            # backtest cost per side
paper_account = "paper_account.json"
paper_cash = 100000
journal = "bot_journal.jsonl"
require_backtest_for_live = true
live_min_trades = 30
live_min_profit_factor = 1.2

# The 24/5 News Reaction plan (newsspider/strategy24.py), for stocks that trade Sunday 20:00 to
# Friday 20:00 ET. It anchors on the moment the story came out instead of the 9:30 open.
# Backtest it with: newsspider bot backtest --plan 24h
[bot24]
min_move_pct = 2.0             # up 2%+ from the last price before the story
min_rel_volume = 3.0           # 3x normal volume for that time of day
min_window_dollar_volume = 250000   # $ traded since the story; extended hours are thin
reaction_minutes = 15
entry_window_minutes = 120     # enter within 2 hours of the story
max_chase_pct = 1.0
min_stop_pct = 0.75
max_stop_pct = 4.0
target_r = 2.0
breakeven_r = 1.0
max_hold_minutes = 240
weekend_exit = "19:55"         # always flat before the Friday 20:00 close
veto_hours = 12                # a dilution/legal/etc. story this close cancels the trade
slippage_pct = 0.15            # wider overnight spreads

[risk]
risk_per_trade_pct = 0.5       # lose at most 0.5% of the account per trade
max_position_pct = 25.0
max_open_positions = 3
daily_loss_limit_pct = 1.5     # stop for the day after -1.5%
max_trades_per_day = 6
